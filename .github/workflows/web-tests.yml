# The web workspace's own gate — this repo is a shared submodule consumed by more
# than one host repo, so its suites must run AT THE SOURCE on every push/PR, not
# only inside a consumer's CI at whatever pinned SHA it happens to hold.
name: web-tests

on:
  push:
    branches: [main]
    # The submodule gitlink is in this list because bumping it is precisely when the
    # copied chat contract goes stale — the copy's own file never changes, so a
    # packages/web-only filter would skip the run that had something to catch.
    paths:
      - "packages/web/**"
      - "external/agenticdevelopertoolkit"
      - ".github/workflows/web-tests.yml"
  pull_request:
    # The submodule gitlink is in this list because bumping it is precisely when the
    # copied chat contract goes stale — the copy's own file never changes, so a
    # packages/web-only filter would skip the run that had something to catch.
    paths:
      - "packages/web/**"
      - "external/agenticdevelopertoolkit"
      - ".github/workflows/web-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      # `submodules: recursive` is load-bearing, not hygiene: packages/features/bitbag
      # and packages/persona carry `link:` deps into external/agenticdevelopertoolkit,
      # and a `link:` to a missing directory fails at install time with an error that
      # names a path rather than a cause. The submodule is public, so no token is needed.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pure-Python, no toolchain — run it before install so a stale copy fails in
      # seconds rather than after the whole workspace builds. Self-test first: a guard
      # whose failing case has rotted passes vacuously and is worse than no guard.
      - name: chat contract copy is in sync
        run: |
          python3 tools/verify_chat_types_copy_test.py
          python3 tools/verify_chat_types_copy.py
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The submodule's packages are reached through their BUILT output: a `link:` dep
      # resolves by its package.json `exports`, and some of them point only at `./dist`
      # with no source condition (`chat`'s `.` entry is `types` + `import`, both dist).
      # The submodule gitignores dist, so a fresh checkout has none, and bitbag's suite
      # died at import with 'Failed to resolve entry for package
      # "@agenticdevelopertoolkit/chat"' on every run from 2026-09-07 until this step.
      # It is a separate pnpm workspace with its own lockfile, so it installs on its own;
      # these are the two commands its own CI runs, and its `build` includes `themes`'
      # build:data codegen, the other file a fresh checkout lacks.
      - name: build agenticdevelopertoolkit web packages
        working-directory: external/agenticdevelopertoolkit/packages/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Per-package vitest suites (the root `test` script is the same recursive run).
      # Deliberately NOT `lint`: per-package tsc resolves sibling DIST types that a fresh
      # checkout hasn't built — gate types in consumers (which build first) until that's
      # untangled.
      #
      # The dormant-package half of that reason is gone. `controls` carried pre-existing
      # type rot and was the standing example here until the 2026-08 extraction moved the
      # package to agenticdevelopertoolkit, where its lint is that repo's to run; `layout`
      # and `content`, named alongside it until 8e6c123 deleted them, went the same way.
      # Updating this comment when the package it cites leaves is the convention, and it
      # is the point: a reason that outlives its example is how a skip becomes permanent
      # without anyone deciding it should be.
      - run: pnpm -r --if-present run test
